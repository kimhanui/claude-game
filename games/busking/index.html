<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e2b63">
<title>버스킹</title>
<style>
  /* 해 질 녘 광장: 남색 하늘 + 가로등 호박색. 모바일 퍼스트 */
  :root { --ink:rgba(32,28,60,.76); --line:rgba(255,214,150,.30); --text:#fff4e2; --sub:#d8c7b0; --amber:#ffc65c; --low:#7fb3ff; --mid:#ffc65c; --high:#ff8fb1;
    --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px); --sal:env(safe-area-inset-left, 0px); --sar:env(safe-area-inset-right, 0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#2e2b63; color:var(--text); overscroll-behavior:none;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; user-select:none; -webkit-user-select:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; z-index:2; }
  a.btn, button { background:var(--ink); color:var(--text); border:1px solid var(--line); border-radius:12px; min-height:40px; padding:0 12px;
    font-size:14px; cursor:pointer; text-decoration:none; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; touch-action:manipulation; }
  a.btn:focus-visible, button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  .icon { width:40px; padding:0; font-size:18px; }

  #top { top:calc(var(--sat) + 10px); left:calc(var(--sal) + 10px); right:calc(var(--sar) + 10px); display:flex; gap:8px; align-items:center; pointer-events:none; }
  #top > * { pointer-events:auto; }
  .chip { background:var(--ink); border:1px solid var(--line); border-radius:999px; min-height:40px; padding:0 14px; display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--sub); white-space:nowrap; }
  #crowd b { font-size:20px; color:var(--text); font-variant-numeric:tabular-nums; }
  #state .dot { width:9px; height:9px; border-radius:50%; background:#6f6a8f; transition:background .2s, box-shadow .2s; }
  body.playing #state .dot { background:var(--amber); box-shadow:0 0 10px var(--amber); }
  body.playing #state { color:var(--text); }
  #right { margin-left:auto; display:flex; gap:8px; }

  /* 데스크톱: 키보드 배치 그대로 보여주는 키캡 */
  #keys { bottom:calc(var(--sab) + 14px); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:5px; pointer-events:none;
    background:var(--ink); border:1px solid var(--line); border-radius:16px; padding:8px 10px; opacity:.92; }
  #keys .row { display:flex; gap:5px; }
  #keys .row[data-oct="1"] { padding-left:10px; }
  #keys .row[data-oct="0"] { padding-left:24px; }
  .cap { width:36px; height:34px; border-radius:8px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-bottom:3px solid var(--c);
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; transition:transform .06s, background .1s; }
  .cap .k { font-size:10px; color:var(--sub); }
  .cap .n { font-size:12px; font-weight:700; }
  .cap.on { background:var(--c); color:#2a2240; transform:translateY(2px); }
  .cap.on .k { color:#2a2240; }

  /* 터치 기기: 가운데 옥타브 10음 패드 */
  #pads { display:none; bottom:calc(var(--sab) + 10px); left:calc(var(--sal) + 10px); right:calc(var(--sar) + 10px);
    grid-template-columns:repeat(5, 1fr); gap:8px; }
  .pad { min-height:58px; border-radius:14px; font-size:17px; font-weight:700; border-bottom:4px solid var(--c); touch-action:none; }
  .pad.on { background:var(--c); color:#2a2240; }
  @media (pointer:coarse) { #keys { display:none; } #pads { display:grid; } }

  #intro { position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(ellipse at 50% 70%, rgba(255,170,90,.25), rgba(30,26,60,.82) 70%); }
  #intro[hidden] { display:none; }
  .card { max-width:400px; width:100%; background:rgba(32,28,60,.9); border:1px solid var(--line); border-radius:20px; padding:26px 24px 22px; }
  .card h1 { margin:0 0 14px; font-size:34px; letter-spacing:-.5px; }
  .card p { word-break:keep-all; margin:0 0 10px; font-size:15px; line-height:1.6; color:var(--sub); }
  .card ul { margin:14px 0 20px; padding:0; list-style:none; font-size:14px; line-height:1.9; }
  .card li span { display:inline-block; min-width:72px; padding:0 8px; margin-right:8px; border-radius:6px; text-align:center; font-weight:700; color:#2a2240; }
  .card button { width:100%; min-height:48px; font-size:16px; font-weight:700; background:var(--amber); color:#2a2240; border:none; }
  .card .tip { font-size:12px; margin:12px 0 0; }
  @media (pointer:coarse) { .desk { display:none; } }
  @media (pointer:fine) { .touch { display:none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="top" class="hud">
  <a class="btn icon" href="../../index.html" aria-label="게임 목록">←</a>
  <div class="chip" id="crowd">듣는 사람 <b id="crowdN">0</b></div>
  <div class="chip" id="state"><span class="dot"></span><span id="stateT">쉬는 중</span></div>
  <div id="right">
    <button class="icon" id="viewBtn" aria-label="시점 초기화" title="시점 초기화">↺</button>
    <button class="icon" id="helpBtn" aria-label="조작법">?</button>
  </div>
</div>

<div id="keys" class="hud" aria-hidden="true"></div>
<div id="pads" class="hud"></div>

<div id="intro">
  <div class="card">
    <h1>버스킹</h1>
    <p>해 질 녘 광장, 기타를 메고 섰어요. 사람들은 바쁘게 지나가요.</p>
    <p>키를 누를 때마다 기타가 한 음씩 울려요. 계속 연주하면 지나가던 사람이 하나둘 멈춰 서서 들어요.</p>
    <ul class="desk">
      <li><span style="background:var(--high)">Q ~ P</span>높은 도레미</li>
      <li><span style="background:var(--mid)">A ~ ;</span>가운데 도레미</li>
      <li><span style="background:var(--low)">Z ~ /</span>낮은 도레미</li>
    </ul>
    <ul class="touch"><li>아래 패드를 눌러 연주해요.</li></ul>
    <button id="startBtn">연주 시작</button>
    <p class="tip desk">한/영 상태와 상관없이 연주돼요. 화면을 끌면 시점이 돌아가고, 휠로 확대해요.</p>
    <p class="tip touch">화면을 끌면 시점이 돌아가요.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
